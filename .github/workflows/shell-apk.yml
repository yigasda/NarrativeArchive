# 껍데기 앱(app/android) APK 만들기. 손으로 돌리거나(Actions › Shell APK › Run workflow), app/android가 바뀌어 main에 올라오면 돌아요.
# 다 되면 Releases에 "shell-latest"로 올라가요 — 폰에서 그 APK를 받아 설치해요.
# 서명 키(선택): 저장소 Secrets에 SHELL_KEYSTORE_B64 · SHELL_KEYSTORE_PASSWORD · SHELL_KEY_ALIAS · SHELL_KEY_PASSWORD 를 넣으면
# 매번 같은 키로 서명해서 지우지 않고 덮어 설치돼요. 없으면 매번 새 디버그 키라 업데이트 때 지우고 다시 설치해야 해요.
name: Shell APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/android/**', '.github/workflows/shell-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key
        env:
          KS: ${{ secrets.SHELL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/shell.jks"
            echo "SHELL_KEYSTORE_FILE=$RUNNER_TEMP/shell.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
          SHELL_VERSION_CODE: ${{ github.run_number }}
          SHELL_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p app/android assembleRelease
          cp app/android/app/build/outputs/apk/release/app-release.apk NarrativeArchive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shell-latest
          name: NarrativeArchive 앱 (껍데기)
          body: |
            실리태번을 화면 꽉 채워 띄우는 앱이에요. 상단바 · 하단바가 폰 화면 색을 따라가요.
            빌드 ${{ github.run_number }} · ${{ github.sha }}
          files: NarrativeArchive.apk
          make_latest: false
