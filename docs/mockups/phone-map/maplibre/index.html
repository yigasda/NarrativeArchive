:root { --bg: #eef0f3; --card: #ffffff; --ink: #1d2433; --sub: #6b7280; --line: #e3e6eb; --on: #1d3461; --onink: #ffffff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #17181c; --card: #23252b; --ink: #eceef2; --sub: #9aa0aa; --line: #34373e; --on: #e9dfcf; --onink: #1b1b1f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, 'SF Pro Text', 'Noto Sans KR', sans-serif;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.wrap { max-width: 420px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 4px 0 0; }
.sub { color: var(--sub); font-size: 12.5px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; border-radius: 999px; padding: 7px 11px; font: 600 12.5px/1 inherit; font-family: inherit; background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(22,27,34,.06); cursor: pointer; }
.chips button.on { background: var(--on); color: var(--onink); }
.frame { position: relative; width: 100%; aspect-ratio: 390 / 560; border-radius: 22px; overflow: hidden; background: #faf6ee; box-shadow: 0 1px 2px rgba(22,27,34,.05), 0 10px 26px rgba(22,27,34,.12); }
#map, #old { position: absolute; inset: 0; }
#old { display: none; width: 100%; height: 100%; }
.frame.showold #old { display: block; }
.credit { position: absolute; right: 8px; bottom: 6px; font: 500 8.5px/1 -apple-system, 'Noto Sans KR', sans-serif; color: #8a8f98; text-shadow: 0 0 2px #fff, 0 0 2px #fff; pointer-events: auto; }
.credit a { color: inherit; text-decoration: none; }
.frame.showold .credit { display: none; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: 0 1px 2px rgba(22,27,34,.06); }
.seg button { border: 0; background: transparent; color: var(--ink); font: 600 12.5px/1 inherit; font-family: inherit; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.seg button.on { background: var(--on); color: var(--onink); }
.seg button:disabled { opacity: .35; cursor: default; }
.stat { font-variant-numeric: tabular-nums; color: var(--sub); font-size: 12.5px; }
.note { background: var(--card); border-radius: 16px; padding: 12px 14px; font-size: 12.5px; color: var(--sub); box-shadow: 0 1px 2px rgba(22,27,34,.04), 0 8px 24px rgba(22,27,34,.05); }
.note b { color: var(--ink); }
.err { color: #b8573a; }
.maplibregl-ctrl-attrib { display: none; }
</style>
</head>

<div class="wrap">
  <h1>실제 지도 시험</h1>
  <p class="sub">MapLibre + OpenFreeMap 타일에 지도 룰 색만 입혔어요. 손가락으로 움직이고 확대할 수 있어요.</p>

  <div class="frame" id="frame">
    <div id="map"></div>
    <img id="old" alt="지금 지도">
    <div class="credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenMapTiles © OpenStreetMap contributors</a></div>
  </div>
  <div class="row">
    <div class="seg"><button id="bNew" class="on">새 지도</button><button id="bOld">지금 지도</button></div>
