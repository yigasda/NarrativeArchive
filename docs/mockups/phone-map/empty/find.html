<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#d9dce2;font-family:-apple-system,'Noto Sans KR',sans-serif;color:#161b22;padding:24px;width:1330px}
h1{font-size:22px;margin-bottom:16px}.row{display:grid;grid-template-columns:repeat(3,400px);gap:24px}.col>b{display:block;font-size:17px}.col>small{display:block;font-size:12.5px;color:#555;margin:4px 0 10px;min-height:34px}
.ph{width:392px;height:833px;position:relative;overflow:hidden;background:0 0/392px auto no-repeat;border-radius:44px}
.b1{position:absolute;left:332px;top:66px;width:38px;height:38px;border-radius:50%;background:#2f6bff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(47,107,255,.35);display:grid;place-items:center}
.cov{position:absolute;background:#f3f4f6}
.th{position:absolute;left:30px;right:22px;display:flex;align-items:baseline;gap:8px}.th b{font-size:20px;font-weight:600}.th span{font-size:13px;color:#6b7380}
.pb{margin-left:auto;align-self:center;display:flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:#2f6bff;color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap}
</style></head><body><h1>파란 돋보기 — 어디에 둘까</h1><div class="row">
<div class="col"><b>1. 오른쪽 위 돋보기를 파랗게 (기록 있음)</b><small>버튼 자리 그대로, 파란 바탕 + 흰 돋보기. 스크롤해도 늘 보여요.</small>
<div class="ph" style="background-image:url(visited.png)"><i class="b1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM20 20l-4-4"/></svg></i></div></div>
<div class="col"><b>1. 같은 버튼 (빈 화면)</b><small>빈 화면도 같은 파란 버튼. 목록 맨 아래 파란 줄은 그대로.</small>
<div class="ph" style="background-image:url(emptyA.png)"><i class="b1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM20 20l-4-4"/></svg></i></div></div>
<div class="col"><b>2. 도시 제목 줄 오른쪽 "도시 찾기"</b><small>"Varo 1곳 · 마지막 24.10." 오른쪽 끝. 위 돋보기는 흰색 그대로.</small>
<div class="ph" style="background-image:url(visited.png)"><i class="cov" style="left:20px;right:20px;top:588px;height:36px"></i><div class="th" style="top:592px"><b>Varo</b><span>1곳 · 마지막 24.10.</span><em class="pb" style="font-style:normal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM20 20l-4-4"/></svg>도시 찾기</em></div></div></div>
</div></body></html>
