<script src="flags.js"></script><script>document.getElementById('g').innerHTML=Object.keys(FLAGS.F).map(c=>`<div class="c">${FLAGS.svg(c,90)}<div class="sm">${FLAGS.svg(c,22)}${FLAGS.NAME[c]}</div></div>`).join('')</script></body></html>
