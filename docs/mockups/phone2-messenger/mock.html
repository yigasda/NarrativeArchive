*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9dbe0;font-family:-apple-system,'SF Pro Text','Noto Sans KR','WenQuanYi Zen Hei',sans-serif;color:#15171c;padding:28px 24px 40px;width:max-content}

.cap{font-size:13px;color:#5b606c;text-align:center;margin-top:8px}

.scr{position:absolute;inset:0;overflow:hidden}
.num{font-family:'Inter Tight','Inter',sans-serif;font-feature-settings:'tnum'}
/* status bar + notch (실시간: 초록 점) */

.ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:40}
.wht .sb{color:#fff}.wht .ind{background:#fff}

.g-mara{background:radial-gradient(40% 50% at 25% 35%,#6f8fe6 0,transparent 70%),radial-gradient(45% 55% at 75% 70%,#a9c4f7 0,transparent 70%),radial-gradient(40% 40% at 70% 20%,#c7b8f2 0,transparent 70%),#94acee}

.g-yuna{background:radial-gradient(40% 50% at 30% 35%,#f2a2b4 0,transparent 70%),radial-gradient(45% 50% at 72% 70%,#f7c6a6 0,transparent 70%),radial-gradient(35% 40% at 75% 20%,#e7b3e0 0,transparent 70%),#f1b0b4}
.g-grp{background:radial-gradient(45% 50% at 25% 40%,#8a6fdc 0,transparent 70%),radial-gradient(40% 50% at 75% 70%,#d79ad8 0,transparent 70%),radial-gradient(35% 40% at 70% 15%,#a7a1ef 0,transparent 70%),#a688de}

.orb{position:relative;overflow:hidden;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(22,27,34,.12)}

svg{display:block}

{

 <div class="list">${ROOMS.map(r => { const s = stOf(r); return `<div class="rm"><span class="fx"><span class="blob" style="${SG[s.s]}"></span></span>${orb(r.k, 48)}<div class="t"><b>${r.name}</b><p>${r.typing ? 'Mara가 입력 중…' : (r.who ? r.who + ': ' : r.me ? '나: ' : '') + r.last}</p><span class="stt">${ic(s.i, 12, '#3a3f47')}${s.t}</span></div><div class="r"><span class="num">${r.t}</span>${r.un ? `<span class="un">${r.un}</span>` : '<span style="height:21px"></span>'}</div></div>`; }).join('')}</div>
 <div class="newb">${ic('plus', 18, '#fff', 2.4)}새 대화</div>`;
const msg = (m, grp) => m.d ? `<div class="day">${m.d}</div>` : m.typing ? `<div class="typ"><i></i><i></i><i></i></div>` : m.state ? ''
  : `${grp && m.f !== 'me' ? `<div class="sn">${orb(m.f, 18)}${nm(m.f)}</div>` : ''}<div class="b ${m.f === 'me' ? 'me' : 'th'}">${m.x}${m.ko ? (m.fold ? `<br><span class="kof">${ic('tr', 13, '#6d7fae')}번역 보기</span>` : `<span class="ko">${m.ko}</span>`) : ''}</div>${m.read ? `<div class="rd">${m.read === 1 ? 'Mara 읽음 · Ivo 아직' : '읽음'} · <span class="num">${m.t}</span></div>` : ''}`;

const grp = css + sbar() + head('grp', 'Varo Werkstatt') + `<div class="scard"><span class="blob" style="${SG.away}"></span><span class="gl"></span><span class="grain"></span><span class="pg">Mara 깨어 있음</span><div class="in"><small>Ivo · 지금</small><h4>비행 중 · 22:40 도착</h4><small>내리면 읽어요</small></div><div class="bar"><i class="on"></i><i class="on"></i><i></i><i></i></div></div><div class="msgs">${GRP.map(m => msg(m, true)).join('')}</div>` + inp;
row('D', '상태 띠', '화면은 거의 흰색. 그라데이션은 "지금 상태"에만 써요.<br>방 줄 오른쪽에 상태 색이 번지고(바쁨 산호 · 비행 파랑 · 잠 보라), 방 위엔 상태 카드 + 언제 연락되는지 막대.<br>내 말은 앱 파랑.', [phone('D', list, '방 목록'), phone('D', chat, '1:1 · 입력 중 · 번역 접기'), phone('D', grp, '단체방 · 비행 중')]);
}

/* =====================================================================
   고른 것: 목록 A + 방 안 C. 남은 화면(새 대화 · 자는 중 늦은 답 · Ren 폰 읽기 전용)
   ===================================================================== */
{
const A = G.A, C = G.C;
const css = `<style>

.N .go{position:absolute;left:16px;right:16px;bottom:30px;height:58px;border-radius:999px;background:#15161a;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15.5px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 10px 24px rgba(22,27,34,.2)}

.C .ro{position:absolute;left:12px;right:12px;bottom:26px;height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;color:rgba(30,32,40,.65)}
.C .who{position:absolute;top:124px;left:0;right:0;text-align:center}
.C .who span{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:#fff;background:rgba(20,22,30,.32);backdrop-filter:blur(10px);border-radius:999px;padding:5px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.C .stl b{font-size:13.5px}
</style>`;
const pick = css + G.A.css + sbar() + `<div class="top"><span class="cb">${ic('back', 20)}</span><h1>새 대화</h1><span style="width:46px"></span></div>
 <div style="height:118px"></div>
 <div class="srch">${ic('srch', 18, '#a2a7b0')}이름 찾기</div>
 <div class="picked">${['mara', 'ren'].map(k => `<span class="pk">${orb(k, 52)}<span class="x">${ic('plus', 12, '#fff', 3).replace('<path', '<path transform="rotate(45 12 12)"')}</span>${P[k].n}</span>`).join('')}</div>
 <div class="gname"><span class="blob g-grp"></span><span class="gl"></span><span class="grain"></span><div class="in"><small>단체방 이름</small><b>주말 Varo<u></u></b></div></div>
 <div class="sec">사람</div>
 <div class="list">${[['mara', 'Varo', 1], ['ren', '서울', 1], ['ivo', 'Varo', 0]].map(([k, sub, on]) => `<div class="rm">${orb(k, 46)}<div class="t"><b>${P[k].n}</b><p>${sub}</p></div><span class="ck ${on ? 'on' : ''}">${on ? ic('chk', 15, '#fff', 3) : ''}</span></div>`).join('')}</div>
 <div class="go">단체방 만들기 <em>· 나 포함 3명</em></div>`;
const LATE = [{ d: '오늘' }, { f: 'ren', t: '18:20', x: '오늘 진짜 피곤하다' }, { f: 'me', t: '18:40', x: '일찍 자 ㅋㅋ', read: true }, { f: 'ren', t: '19:02', x: '응 씻고 바로 잘 듯' },
  { f: 'me', t: '21:03', x: '아 맞다 내일 몇 시에 봐?', read: 1 }, { f: 'me', t: '21:04', x: '점심 같이 먹을까', read: 1 }, { sleep: 1 }];
const msgL = m => m.sleep ? '' : C.msg(m);
const late = css + C.css + C.bg('g-ren') + sbar(true) + C.head('ren', 'Ren', '자는 중') + `<div class="msgs" style="top:130px">${LATE.map(msgL).join('')}</div>` + C.inp;

document.getElementById('out').innerHTML = (only ? out.filter(x => x.includes(`<h2>${only}.`)) : out).join('');
