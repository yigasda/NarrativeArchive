<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>누가 아는가 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
.sw{width:40px;height:24px;border-radius:999px;background:#B8541F;position:relative;flex:none}
.sw::after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; padding: 22px 18px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 12px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <b style="font-size: 20px; letter-spacing: -0.01em">누가 아는가</b>
    <span style="font-size: 12.5px; color: #7A6A60">비밀 7개 · 지금 인물 3명 기준</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 10px 0; border-radius: 14px">AI로 더하기 · 고치기</button>
    <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 13px; padding: 10px 0; border-radius: 14px">AI로 다듬기</button>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 16px; padding: 10px 14px">
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 13.5px">주입하기</b><span class="num" style="font-size: 11.5px; color: #8A7A70">모르는 걸 아는 척하지 않게 · 약 310 토큰</span></span>
    <span class="sw"></span>
  </div>

  <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
    <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px; align-items: flex-start">
        <b style="flex: 1; font-size: 13.5px; line-height: 1.5; font-weight: 600">{{f.text}}</b>
        <button aria-label="지우기" style="width: 24px; height: 24px; border: 0; background: transparent; color: #B8A99E; padding: 0; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: 54px 1fr; row-gap: 7px; align-items: center">
        <span style="font-size: 12px; font-weight: 700; color: #2A211C">알아요</span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{f.k}}" as="w" hint-placeholder-count="1"><span style="display: flex; align-items: center; gap: 5px; padding: 2px 10px 2px 3px; border-radius: 999px; background: #2A211C; color: #FFFAF6; font-size: 12.5px; font-weight: 600"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{w.c}}; color: #fff; display: grid; place-items: center; font-size: 10px">{{w.i}}</span>{{w.n}}</span></sc-for>
          <sc-if value="{{f.noK}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: #8A7A70">아직 아무도</span></sc-if>
        </span>
        <sc-if value="{{f.hasS}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 12px; color: #8A5A00">짐작해요</span>
        </sc-if>
        <sc-if value="{{f.hasS}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{f.s}}" as="w" hint-placeholder-count="1"><span style="display: flex; align-items: center; gap: 5px; padding: 1px 10px 1px 2px; border-radius: 999px; border: 1.5px solid #D9A040; color: #6B4A00; font-size: 12.5px"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{w.c}}; color: #fff; display: grid; place-items: center; font-size: 10px">{{w.i}}</span>{{w.n}} ?</span></sc-for>
          </span>
        </sc-if>
        <span style="font-size: 12px; color: #A99C92">몰라요</span>
        <span style="font-size: 12.5px; color: #A99C92">{{f.u}}</span>
      </div>
      <span style="font-size: 11.5px; color: #A84A17">{{f.src}}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { Somang: '#B5645A', Set: '#8E3B2E', Horus: '#5E7F3A' };
    const p = list => list.map(n => ({ n, i: n[0], c: C[n] }));
    const f = (text, k, s, u, src) => ({ text, k: p(k), s: p(s), hasS: s.length > 0, noK: k.length === 0, u: u.join(' · '), src });
    return {
      facts: [
        f('Set has often listened through the wind to Somang', ['Set'], ['Horus'], ['Somang'], '#245–#263 · The second seat'),
        f('Horus kept Set’s chained humiliation to himself', ['Horus', 'Set'], [], ['Somang'], 'Y2 #500–#509'),
        f('Chaewon crossed over the same way Somang did', [], ['Somang'], ['Horus', 'Set'], 'Y2 #438–#447 · Sending Chaewon away'),
      ],
    };
  }
}
</script>
</body>
</html>
