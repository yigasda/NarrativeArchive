<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관계 온도 A+C 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 1160px; box-sizing: border-box; padding: 22px 20px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #EBDDD2">
    <button style="flex: 1; border: 0; background: transparent; color: #6B5A50; font: inherit; font-size: 13px; padding: 9px 0; border-radius: 10px">도감</button>
    <button style="flex: 1; border: 0; background: transparent; color: #6B5A50; font: inherit; font-size: 13px; padding: 9px 0; border-radius: 10px">관계도</button>
    <button style="flex: 1; border: 0; background: #FFFAF6; color: #A84A17; font: inherit; font-size: 13px; font-weight: 600; padding: 9px 0; border-radius: 10px; box-shadow: 0 1px 2px rgba(60,30,10,0.12)">온도</button>
  </div>

  <button style="display: flex; align-items: center; gap: 12px; border: 1px solid #E5D5C9; background: #FFFAF6; border-radius: 16px; padding: 10px 14px; font: inherit; color: inherit; text-align: left">
    <span style="display: flex">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #B5645A; color: #fff; display: grid; place-items: center; font-weight: 700; border: 2px solid #FFFAF6">S</span>
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #8E3B2E; color: #fff; display: grid; place-items: center; font-weight: 700; border: 2px solid #FFFAF6; margin-left: -12px">S</span>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.35">
      <b style="font-size: 15px">Somang · Set</b>
      <span style="font-size: 12px; color: #7A6A60">함께 나온 섹션 26개</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A6A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 22px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="flex: none; width: 56px; height: 56px; border-radius: 18px; background: #FBE4D8; display: grid; place-items: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C4521C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 12px; color: #8A7A70">지금 온도</span>
        <span style="display: flex; align-items: baseline; gap: 6px"><b class="num" style="font-size: 30px; color: #C4521C; letter-spacing: -0.02em">+4</b><span style="font-size: 14px; font-weight: 600; color: #C4521C">따뜻함</span></span>
      </span>
      <span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.35">
        <span style="font-size: 11.5px; color: #8A7A70">평균</span>
        <b class="num" style="font-size: 15px">+1.4</b>
      </span>
    </div>

    <svg width="318" height="150" viewBox="0 0 318 150" style="display: block; overflow: visible">
      <defs>
        <clipPath id="w1"><rect x="-4" y="-10" width="326" height="85"></rect></clipPath>
        <clipPath id="c1"><rect x="-4" y="75" width="326" height="85"></rect></clipPath>
      </defs>
      <rect x="{{divX}}" y="0" width="{{y2W}}" height="150" fill="#FBF4EE"></rect>
      <line x1="0" x2="318" y1="75" y2="75" stroke="#DCCBBE" stroke-width="1" stroke-dasharray="2 4"></line>
      <path d="{{area}}" fill="#F3B497" fill-opacity="0.45" clip-path="url(#w1)"></path>
      <path d="{{area}}" fill="#9DBCE3" fill-opacity="0.5" clip-path="url(#c1)"></path>
      <path d="{{curve}}" fill="none" stroke="#C4521C" stroke-width="2.2" stroke-linecap="round" clip-path="url(#w1)"></path>
      <path d="{{curve}}" fill="none" stroke="#3D6FB6" stroke-width="2.2" stroke-linecap="round" clip-path="url(#c1)"></path>
      <circle cx="{{minX}}" cy="{{minY}}" r="4" fill="#FFFAF6" stroke="#3D6FB6" stroke-width="2"></circle>
      <circle cx="{{lastX}}" cy="{{lastY}}" r="9" fill="#C4521C" fill-opacity="0.18"></circle>
      <circle cx="{{lastX}}" cy="{{lastY}}" r="4.5" fill="#C4521C" stroke="#FFFAF6" stroke-width="2"></circle>
    </svg>
    <div style="display: flex; font-size: 11.5px; color: #9A8B80; margin-top: -8px">
      <span style="flex: 12">Y1</span><span style="flex: 14">Y2</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; font: inherit; color: inherit; text-align: left">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8A7A70"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C4471A"></span>가장 따뜻했던 때</span>
      <b style="font-size: 13.5px">Y2 #500–#509</b>
      <span class="num" style="font-size: 12px; color: #C4471A">+5 · 떠나보내려다 붙잡음</span>
    </button>
    <button style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; font: inherit; color: inherit; text-align: left">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8A7A70"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F5F9E"></span>가장 차가웠던 때</span>
      <b style="font-size: 13.5px">Y2 #354–#365</b>
      <span class="num" style="font-size: 12px; color: #2F5F9E">−5 · “벌레”라는 말</span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #6B5A50">크게 바뀐 순간</span>
    <sc-for list="{{moments}}" as="m" hint-placeholder-count="3">
      <button style="display: flex; align-items: center; gap: 12px; border: 1px solid #E5D5C9; background: #FFFAF6; border-radius: 14px; padding: 10px 12px; font: inherit; color: inherit; text-align: left">
        <span class="num" style="flex: none; min-width: 64px; text-align: center; padding: 4px 0; border-radius: 10px; font-size: 13px; font-weight: 700; background: {{m.bg}}; color: {{m.fg}}">{{m.jump}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.35">
          <b style="font-size: 13px">{{m.why}}</b>
          <span style="font-size: 12px; color: #7A6A60">{{m.sec}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px">
    <button style="flex: 1; border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 13px; padding: 11px 0; border-radius: 12px">섹션별 점수 26개</button>
    <button style="flex: 1; border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 11px 0; border-radius: 12px">안 잰 섹션 2개 재기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const s = [2, 4, 4, 1, -2, 0, 3, 2, 3, -3, 1, 3, 3, 2, -1, -3, -5, 1, -1, -4, 2, 4, 5, 4, 3, 4];
    const W = 318, Z = 75, K = 13;
    const P = s.map((v, i) => [6 + i * ((W - 12) / (s.length - 1)), Z - v * K]);
    let curve = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++) {
      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      curve += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    const last = P[P.length - 1];
    const area = `${curve} L${last[0].toFixed(1)},${Z} L${P[0][0].toFixed(1)},${Z} Z`;
    const mi = s.indexOf(Math.min(...s));
    const divX = (P[11][0] + P[12][0]) / 2;
    return {
      curve, area, divX, y2W: W - divX,
      lastX: last[0], lastY: last[1], minX: P[mi][0], minY: P[mi][1],
      moments: [
        { jump: '+3 → −3', why: '약방 천막 사건 뒤 냉랭해짐', sec: '#402–#475 · The apothecary’s tent', bg: '#E3ECF8', fg: '#2F6DB5' },
        { jump: '−5 → +1', why: '“사랑해 줘”, 다시 손을 뻗음', sec: 'Y2 #366–#369 · “Love me”', bg: '#FBE4D8', fg: '#B8471A' },
        { jump: '−4 → +2', why: '손이 먼저 기억해 냄', sec: 'Y2 #398–#407 · What the hand remembered', bg: '#FBE4D8', fg: '#B8471A' },
      ],
    };
  }
}
</script>
</body>
</html>
