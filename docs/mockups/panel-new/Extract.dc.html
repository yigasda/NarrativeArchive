<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원문 뽑기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
.sw{width:40px;height:24px;border-radius:999px;background:#B8541F;position:relative;flex:none}
.sw::after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw.off{background:#D9C8BC}.sw.off::after{right:auto;left:3px}
</style>
</helmet>
<div style="width: 390px; height: 860px; box-sizing: border-box; padding: 22px 18px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <b style="font-size: 20px; letter-spacing: -0.01em">원문 뽑기</b>
    <span style="font-size: 12.5px; color: #7A6A60">압축할 메시지를 골라 복사하거나 .txt로 저장해요</span>
  </div>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 11.5px; color: #8A7A70">부터</span>
        <span class="num" style="display: flex; align-items: center; gap: 4px; border: 1px solid #E5D5C9; border-radius: 12px; padding: 8px 12px; background: #FFFCF9; font-size: 17px; font-weight: 600"><span style="color: #B8A99E">#</span>35</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8A99E" stroke-width="2" stroke-linecap="round" style="margin-top: 18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 11.5px; color: #8A7A70">까지</span>
        <span class="num" style="display: flex; align-items: center; gap: 4px; border: 1px solid #E5D5C9; border-radius: 12px; padding: 8px 12px; background: #FFFCF9; font-size: 17px; font-weight: 600"><span style="color: #B8A99E">#</span>59</span>
      </span>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <button style="border: 0; background: #2A211C; color: #FFFAF6; font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px">경계선 다음부터 끝까지</button>
      <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px">지난번 범위 #12–#34</button>
    </div>
    <div style="display: flex; gap: 2px; height: 8px">
      <span style="flex: 34; border-radius: 4px 0 0 4px; background: #E3D3C7"></span>
      <span style="flex: 25; border-radius: 0 4px 4px 0; background: #B8541F"></span>
    </div>
    <div class="num" style="display: flex; justify-content: space-between; font-size: 12px; color: #8A7A70">
      <span>메시지 25개 · 숨긴 것 0개</span><b style="color: #2A211C">약 4,520 토큰</b>
    </div>
  </div>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">지시문 붙이기</span><span style="font-size: 11.5px; color: #8A7A70">다른 모델에 그대로 붙여넣기용</span></span>
      <span class="sw"></span>
    </div>
    <div style="display: flex; gap: 6px; padding: 0 14px 12px; flex-wrap: wrap">
      <button style="border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px">★ 기본</button>
      <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px">★ 짧게</button>
      <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px">다른 지시문…</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid #F1E6DD">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">뽑기 옵션</span><span style="font-size: 11.5px; color: #8A7A70">숨긴 메시지 뺌 · 태그 지움 · [번호] 이름:</span></span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="border: 1px solid #E5D5C9; border-radius: 16px; background: #FFFCF9; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.6; color: #6B5A50; height: 96px; overflow: hidden">[35] Somang: I won't choose. Don't make me.<br>[36] Set: Then I will wait at the door until you do.<br>[37] Horus: …</div>

  <span style="flex: 1"></span>
  <div style="display: flex; gap: 8px">
    <button style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 13.5px; padding: 12px 0; border-radius: 14px">.txt 저장</button>
    <button style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 13.5px; font-weight: 600; padding: 12px 0; border-radius: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>지시문과 함께 복사</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
