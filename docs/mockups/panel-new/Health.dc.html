<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>건강 점검</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; padding: 22px 18px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 22px; padding: 18px; display: flex; align-items: center; gap: 16px">
    <div style="position: relative; width: 92px; height: 92px; flex: none">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="38" fill="none" stroke="#EFE3DA" stroke-width="9"></circle>
        <circle cx="46" cy="46" r="38" fill="none" stroke="#2E8B57" stroke-width="9" stroke-linecap="round" stroke-dasharray="{{dash}} 999" transform="rotate(-90 46 46)"></circle>
      </svg>
      <span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
        <b class="num" style="font-size: 28px; color: #1F6A40">86</b><span style="font-size: 11px; color: #8A7A70; margin-top: 2px">점</span>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <b style="font-size: 17px">거의 괜찮아요</b>
      <span style="font-size: 12.5px; color: #7A6A60; line-height: 1.45">AI 없이 번호·숨기기·키워드·백업을 훑어봤어요. 고칠 것 2개, 참고 1개.</span>
    </div>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #6B5A50; margin: 2px 2px -6px">고칠 것</span>
  <sc-for list="{{fix}}" as="f" hint-placeholder-count="2">
    <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-left: 0; border-radius: 16px; overflow: hidden; display: flex">
      <span style="width: 5px; flex: none; background: {{f.bar}}"></span>
      <div style="flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; flex-direction: column; line-height: 1.35"><b style="font-size: 13.5px">{{f.title}}</b><span style="font-size: 12px; color: #8A7A70">{{f.sub}}</span></span>
        <button style="align-self: flex-start; border: 0; background: {{f.btnbg}}; color: #fff; font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 10px">{{f.btn}}</button>
      </div>
    </div>
  </sc-for>

  <span style="font-size: 13px; font-weight: 600; color: #6B5A50; margin: 2px 2px -6px">참고</span>
  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D6FB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span style="display: flex; flex-direction: column; line-height: 1.35"><b style="font-size: 13.5px">아주 큰 섹션 1개</b><span style="font-size: 12px; color: #8A7A70">#124–#216 · 2,810 토큰 — 다시 압축하거나 나누면 좋아요</span></span>
  </div>

  <button style="display: flex; align-items: center; gap: 10px; border: 1px solid #E5D5C9; background: #FFFAF6; color: inherit; font: inherit; padding: 12px 14px; border-radius: 16px; text-align: left">
    <span style="width: 22px; height: 22px; border-radius: 50%; background: #E3F2E8; color: #1F6A40; display: grid; place-items: center; flex: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
    <span style="flex: 1; font-size: 13.5px">괜찮은 것 <b>9</b>개</span>
    <span style="font-size: 12px; color: #8A7A70">번호 이어짐 · 숨김 · 키워드 …</span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      dash: (2 * Math.PI * 38 * 0.86).toFixed(1),
      fix: [
        { title: '압축한 메시지 4개가 안 숨겨져 있어요', sub: '#31 – #34 · 아카이브와 같이 들어가요', btn: '숨기기 적용', bar: '#C4362A', btnbg: '#C4362A' },
        { title: '백업한 지 오래됐어요', sub: '마지막 .json 백업 뒤 12번 바뀜', btn: '.json 백업', bar: '#D9822B', btnbg: '#B8541F' },
      ],
    };
  }
}
</script>
</body>
</html>
