<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>숨김 해제</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; padding: 22px 18px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <b style="font-size: 20px; letter-spacing: -0.01em">숨김 해제</b>
    <span style="font-size: 12.5px; color: #7A6A60">숨긴 메시지를 골라 다시 RP 모델이 보게 해요</span>
  </div>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; gap: 6px"><b class="num" style="font-size: 26px; letter-spacing: -0.02em">35</b><span style="font-size: 13px; color: #8A7A70">개 숨김 · 전체 60개</span></div>
    <div style="position: relative; height: 34px">
      <div style="position: absolute; inset: 10px 0; display: flex; gap: 2px">
        <span style="flex: 35; border-radius: 4px 0 0 4px; background: #D9C8BC"></span>
        <span style="flex: 25; border-radius: 0 4px 4px 0; background: #F1E6DD"></span>
      </div>
      <div style="position: absolute; left: {{a}}%; width: {{w}}%; top: 4px; bottom: 4px; border: 2px solid #B8541F; border-radius: 8px; background: rgba(184,84,31,0.18)"></div>
    </div>
    <div class="num" style="display: flex; justify-content: space-between; font-size: 11px; color: #8A7A70"><span>#0</span><span>경계선 #34</span><span>#59</span></div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 11.5px; color: #8A7A70">부터</span>
      <span class="num" style="border: 1px solid #E5D5C9; border-radius: 12px; padding: 8px 12px; background: #FFFAF6; font-size: 16px; font-weight: 600"><span style="color: #B8A99E">#</span>20</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8A99E" stroke-width="2" stroke-linecap="round" style="margin-top: 18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 11.5px; color: #8A7A70">까지</span>
      <span class="num" style="border: 1px solid #E5D5C9; border-radius: 12px; padding: 8px 12px; background: #FFFAF6; font-size: 16px; font-weight: 600"><span style="color: #B8A99E">#</span>34</span>
    </span>
  </div>
  <div style="display: flex; gap: 6px; flex-wrap: wrap">
    <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px">마지막 15개</button>
    <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px">전부</button>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #FFF1D6">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span style="font-size: 12.5px; color: #5C4200; line-height: 1.45">이미 압축된 범위예요. 풀면 아카이브와 원문이 같이 들어가 토큰이 약 2,100 늘어요.</span>
  </div>

  <span style="flex: 1"></span>
  <button style="border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 13px 0; border-radius: 16px">#20 – #34 · 15개 보이게</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { a: (20 / 60 * 100).toFixed(1), w: (15 / 60 * 100).toFixed(1) }; }
}
</script>
</body>
</html>
