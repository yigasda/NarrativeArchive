<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>압축 탭</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
.sw{width:40px;height:24px;border-radius:999px;background:#B8541F;position:relative;flex:none}
.sw::after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw.off{background:#D9C8BC}.sw.off::after{right:auto;left:3px}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; padding: 18px 16px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 12px">

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 12.5px; color: #8A7A70">경계선 #34 뒤에 쌓인 원문</span>
      <span class="num" style="font-size: 12px; color: #8A7A70">마지막 #59</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <b class="num" style="font-size: 32px; letter-spacing: -0.02em; line-height: 1">4,520</b><span style="font-size: 13px; color: #8A7A70">토큰 · 메시지 25개</span>
    </div>
    <div style="display: flex; gap: 2px; height: 10px">
      <span style="flex: 34; border-radius: 4px 0 0 4px; background: #D9C8BC"></span>
      <span style="flex: 25; border-radius: 0 4px 4px 0; background: #E8A27C"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #8A7A70">
      <span>#0 – #34 숨김 (압축됨)</span><span>#35 – #59 원문</span>
    </div>
    <button style="display: flex; align-items: center; gap: 12px; border: 0; background: #B8541F; color: #fff; font: inherit; padding: 14px 16px; border-radius: 16px; text-align: left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M15 9h0M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/></svg>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3">
        <b style="font-size: 15.5px">압축 마법사</b>
        <span style="font-size: 12px; opacity: 0.85">뽑기 → 복사 → 붙여넣기 → 채점 → 추가</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border: 1px solid #E5D5C9; background: #FFFAF6; color: inherit; font: inherit; padding: 12px; border-radius: 16px; text-align: left">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #F1E6DD; display: grid; place-items: center; color: #6B5A50"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg></span>
      <b style="font-size: 13.5px">숨기기 다시 적용</b>
      <span style="font-size: 11.5px; color: #8A7A70; line-height: 1.35">경계선 앞만 숨기고 뒤는 보이게</span>
    </button>
    <button style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border: 1px solid #E5D5C9; background: #FFFAF6; color: inherit; font: inherit; padding: 12px; border-radius: 16px; text-align: left">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: #F1E6DD; display: grid; place-items: center; color: #6B5A50"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span>
      <b style="font-size: 13.5px">숨김 해제</b>
      <span class="num" style="font-size: 11.5px; color: #8A7A70; line-height: 1.35">지금 숨긴 메시지 35개</span>
    </button>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #6B5A50; margin: 4px 2px -4px">따로 하기</span>
  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; overflow: hidden">
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; color: inherit; font: inherit; padding: 12px 14px; text-align: left">
      <span class="num" style="width: 26px; height: 26px; border-radius: 50%; background: #F6E1D3; color: #8A3A12; font-size: 12.5px; font-weight: 700; display: grid; place-items: center">1</span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 13.5px">원문 뽑기</b><span style="font-size: 11.5px; color: #8A7A70">경계선 이후 메시지 · 지시문 붙여 복사</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; border: 0; border-top: 1px solid #F1E6DD; background: transparent; color: inherit; font: inherit; padding: 12px 14px; text-align: left">
      <span class="num" style="width: 26px; height: 26px; border-radius: 50%; background: #F6E1D3; color: #8A3A12; font-size: 12.5px; font-weight: 700; display: grid; place-items: center">2</span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 13.5px">아카이브에 추가</b><span style="font-size: 11.5px; color: #8A7A70">압축본 붙여넣기 · 번호 검사 · 경계선 자동</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <span style="font-size: 13px; font-weight: 600; color: #6B5A50; margin: 4px 2px -4px">설정</span>
  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">숨긴 메시지 빼고 뽑기</span></span>
      <span class="sw"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #F1E6DD">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">태그 지우기</span><span style="font-size: 11.5px; color: #8A7A70">&lt;think&gt; 통째로 · 나머지 태그는 글자만 · 직접 추가 2개</span></span>
      <span class="sw"></span>
    </div>
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; border: 0; border-top: 1px solid #F1E6DD; background: transparent; color: inherit; font: inherit; padding: 12px 14px; text-align: left">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">압축 지시문</span><span style="font-size: 11.5px; color: #8A7A70">3개 · 즐겨찾기 ★ 기본</span></span>
      <span style="font-size: 12.5px; color: #8A7A70">편집</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #F1E6DD">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">아카이브 따라가기</span><span style="font-size: 11.5px; color: #8A7A70">마지막 제목 번호가 곧 경계선</span></span>
      <span class="sw off"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #F1E6DD">
      <span style="flex: 1; font-size: 13.5px">경계선 번호</span>
      <span class="num" style="min-width: 64px; text-align: center; border: 1px solid #E5D5C9; border-radius: 10px; padding: 4px 10px; background: #FBF4EE">#34</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid #F1E6DD">
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 13.5px">숨길 때 남길 메시지</span><span style="font-size: 11.5px; color: #8A7A70">경계선 바로 앞 몇 개는 보이게</span></span>
      <span style="display: flex; align-items: center; border: 1px solid #E5D5C9; border-radius: 10px; overflow: hidden">
        <button aria-label="줄이기" style="width: 30px; height: 30px; border: 0; background: #FBF4EE; font: inherit">−</button>
        <b class="num" style="width: 30px; text-align: center; font-size: 13px">1</b>
        <button aria-label="늘리기" style="width: 30px; height: 30px; border: 0; background: #FBF4EE; font: inherit">+</button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
