<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프롬프트 X-ray B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 860px; box-sizing: border-box; padding: 22px 20px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 20px; letter-spacing: -0.01em">프롬프트 X-ray</h1>
    <span style="font-size: 12px; color: #7A6A60">오늘 22:22</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; background: #B3261E; color: #fff; border-radius: 14px; padding: 10px 12px 10px 14px">
    <span style="flex: 1; font-size: 13px; line-height: 1.4"><b>겹침 3,140 토큰</b> · 압축한 #35–#38이 원문으로도 들어갔어요</span>
    <button style="flex: none; border: 0; background: #fff; color: #8C1D18; font: inherit; font-size: 12.5px; font-weight: 700; padding: 7px 12px; border-radius: 9px">숨기기</button>
  </div>

  <div style="background: #FFFCF9; border-radius: 6px; padding: 18px 18px 14px; box-shadow: 0 1px 0 #E5D5C9, 0 6px 18px rgba(90,50,20,0.08); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; font-size: 11.5px; color: #8A7A70; padding-bottom: 8px; border-bottom: 1px dashed #D9C8BC">
      <span>항목</span><span>토큰</span>
    </div>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 9px 0 8px; border-bottom: 1px solid #F3EAE2">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="flex: 1; font-size: 13.5px; color: {{c.ink}}">{{c.name}}</span>
          <span class="num" style="font-size: 13px">{{c.tok}}</span>
        </div>
        <div style="height: 6px; border-radius: 3px; background: #F1E7DF; overflow: hidden">
          <div style="width: {{c.w}}%; min-width: 3px; height: 100%; border-radius: 3px; background: {{c.color}}"></div>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 10px; border-top: 1px dashed #D9C8BC; margin-top: 2px">
      <b style="font-size: 14px">합계</b>
      <b class="num" style="font-size: 17px">41,280</b>
    </div>
    <span style="font-size: 11.5px; color: #8A7A70; text-align: right">메시지 29개 · 월드인포 4개</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 600; color: #6B5A50">두 번 들어간 문장</span>
    <div style="display: flex; align-items: center; gap: 10px; background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 14px; padding: 10px 12px">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
        <span style="font-size: 13px">아카이브 ↔ 월드인포 · Horus</span>
        <span style="font-size: 12px; color: #8A7A70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">“Horus could not classify it, and noted he could not…”</span>
      </span>
      <span class="num" style="font-size: 12px; color: #8A7A70">109자</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['서사 아카이브', 18420, '#B8541F'],
      ['대화 기록', 12880, '#A99C92'],
      ['겹친 대화 (#35–#38)', 3140, '#D23B2C'],
      ['월드인포', 2310, '#7B5BC4'],
      ['캐릭터 카드', 1920, '#3D6FB6'],
      ['다른 확장', 1460, '#C99A1E'],
      ['그 외', 940, '#C9BCB1'],
      ['페르소나', 210, '#2E9A7A'],
    ];
    const max = 18420;
    return {
      cats: rows.map(([name, t, color]) => ({ name, color, tok: t.toLocaleString(), w: (t / max * 100).toFixed(1), ink: color === '#D23B2C' ? '#B3261E' : '#2A211C' })),
    };
  }
}
</script>
</body>
</html>
