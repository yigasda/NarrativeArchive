<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인물 도감 B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; padding: 22px 0 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; gap: 14px; padding: 0 20px; overflow: hidden">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="5">
      <button style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit; width: 58px">
        <span style="width: 52px; height: 52px; border-radius: 50%; background: {{p.color}}; color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 700; box-shadow: {{p.ring}}">{{p.initial}}</span>
        <span style="font-size: 11.5px; font-weight: {{p.weight}}; color: {{p.ink}}">{{p.name}}</span>
      </button>
    </sc-for>
    <button aria-label="인물 넣기" style="flex: none; width: 52px; height: 52px; border-radius: 50%; border: 1.5px dashed #CDBBAE; background: transparent; color: #8A7A70; display: grid; place-items: center; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div style="margin: 0 20px; border-radius: 24px; overflow: hidden; background: #FFFAF6; border: 1px solid #E5D5C9">
    <div style="height: 76px; background: #8E3B2E"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: -48px; padding: 0 16px 16px">
      <span style="position: relative">
        <span style="width: 96px; height: 96px; border-radius: 50%; background: #A6493A; color: #fff; display: grid; place-items: center; font-size: 38px; font-weight: 700; border: 4px solid #FFFAF6">S</span>
        <button aria-label="얼굴 바꾸기" style="position: absolute; right: 0; bottom: 4px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #FFFAF6; background: #2A211C; color: #fff; display: grid; place-items: center; padding: 0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
      </span>
      <b style="font-size: 22px; line-height: 1.2; margin-top: 4px">Set</b>
      <span style="font-size: 12.5px; color: #8A7A70">“You don’t get to decide that for me.”</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 10px">
        <div style="display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 12px; background: #FBF4EE"><b class="num" style="font-size: 18px">53</b><span style="font-size: 11px; color: #8A7A70">섹션</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 12px; background: #FBF4EE"><b class="num" style="font-size: 18px">12</b><span style="font-size: 11px; color: #8A7A70">대사</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; padding: 8px 0; border-radius: 12px; background: #FBF4EE"><b class="num" style="font-size: 18px; color: #C4471A">+4</b><span style="font-size: 11px; color: #8A7A70">Somang과</span></div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 18px; padding: 0 24px; border-bottom: 1px solid #E3D3C7">
    <button style="border: 0; border-bottom: 2px solid #2A211C; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #2A211C; padding: 0 2px 8px">지금 상태</button>
    <button style="border: 0; background: transparent; font: inherit; font-size: 14px; color: #8A7A70; padding: 0 2px 8px">관계 4</button>
    <button style="border: 0; background: transparent; font: inherit; font-size: 14px; color: #8A7A70; padding: 0 2px 8px">나온 섹션</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px">
    <sc-for list="{{state}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px; background: #FFFAF6; border: 1px solid #EADBD0; border-radius: 14px; padding: 11px 13px">
        <span class="num" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: #F1E6DD; color: #8A3A12; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; margin-top: 1px">{{s.n}}</span>
        <span style="font-size: 13.5px; line-height: 1.55; color: #3A2E27">{{s.text}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px">
    <button style="flex: 1; border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 13px; padding: 10px 0; border-radius: 12px">처음 #0–#47</button>
    <button style="flex: 1; border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 13px; padding: 10px 0; border-radius: 12px">최근 Y2 #574–#604</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const ps = [['Somang', '#B5645A'], ['Set', '#8E3B2E'], ['Horus', '#5E7F3A'], ['Chaewon', '#9A6B3F'], ['Nephthys', '#4F6F8F']];
    return {
      people: ps.map(([name, color]) => ({
        name, color, initial: name[0],
        ring: name === 'Set' ? '0 0 0 3px #F6EDE6, 0 0 0 5px #2A211C' : 'none',
        weight: name === 'Set' ? 700 : 400, ink: name === 'Set' ? '#2A211C' : '#6B5A50',
      })),
      state: [
        '남쪽 사막을 몸으로 다스리고, 바람이 실어 오는 말을 들어요. 신전 다른 곳의 대화까지.',
        '사랑·보호·두려움이 그녀의 선택을 지울 권리는 아니라는 걸 배웠어요. 겁나면 아직 손이 먼저 나가요.',
        'Y2 #506 첫 사과 이후로 그녀의 선택에 명령하지 않고, 몰래 지켜보지 않고, 말하면 물러나요.',
        '춥고 습한 북쪽에선 바람 감각이 무뎌지고 사막의 열기도 약해요.',
      ].map((text, i) => ({ n: i + 1, text })),
    };
  }
}
</script>
</body>
</html>
