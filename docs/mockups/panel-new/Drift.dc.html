<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이탈 감지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; padding: 22px 18px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <b style="font-size: 20px; letter-spacing: -0.01em">이탈 감지</b>
    <span style="font-size: 12.5px; color: #7A6A60">RP 모델이 정해진 사실과 어긋나게 쓴 곳 · 참고용</span>
  </div>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; font-size: 13.5px">최근 메시지</span>
      <span style="display: flex; align-items: center; border: 1px solid #E5D5C9; border-radius: 10px; overflow: hidden">
        <button aria-label="줄이기" style="width: 32px; height: 32px; border: 0; background: #FBF4EE; font: inherit">−</button>
        <b class="num" style="width: 36px; text-align: center">12</b>
        <button aria-label="늘리기" style="width: 32px; height: 32px; border: 0; background: #FBF4EE; font: inherit">+</button>
      </span>
      <span style="font-size: 13.5px">개</span>
    </div>
    <button style="display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: #B8541F; color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 11px 0; border-radius: 14px">검사하기</button>
    <span class="num" style="font-size: 11.5px; color: #8A7A70; text-align: center">아카이브 약 24,337 토큰 + 최근 대화를 AI 기능 모델에 보내요 · 자동 감지 꺼짐</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px -6px">
    <span style="font-size: 13px; font-weight: 600; color: #6B5A50">어긋난 곳 2개</span>
    <span class="num" style="font-size: 12px; color: #8A7A70">오늘 23:19 · #48–#59 · 8개 검사</span>
  </div>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
    <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px">
        <button class="num" style="border: 0; background: #2A211C; color: #FFFAF6; font: inherit; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 8px">{{it.msg}}</button>
        <b style="font-size: 13.5px">{{it.who}}</b>
        <span style="font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: {{it.kbg}}; color: {{it.kfg}}">{{it.kind}}</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.55">{{it.text}}</span>
      <div style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 12px; background: #FBF4EE">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 3px"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.4"><span style="font-size: 12px; color: #6B5A50">{{it.ev}}</span><span style="font-size: 12px; color: #A84A17">{{it.sec}}</span></span>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: #E3F2E8; color: #1F6A40; font-size: 12.5px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    나머지 6개 메시지는 아카이브와 맞아요
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { msg: '#57', who: 'Set', kind: '모르는 걸 앎', kbg: '#FBE7E2', kfg: '#8C1D18', text: 'Set이 Somang의 어머니 이야기를 꺼내요. 그는 아직 그 얘기를 들은 적이 없어요.', ev: '누가 아는가: 어머니에게 전한 말 — Set은 모름', sec: '#503–#538 · What he could give' },
        { msg: '#55', who: 'Horus', kind: '해결된 떡밥', kbg: '#FFF1D6', kfg: '#8A5A00', text: '호루스가 신전 사제 문제를 다시 꺼내요. 사제 없이 셋이 돌보기로 이미 정했어요.', ev: 'STATE: Ombos has no priesthood', sec: 'Current household' },
      ],
    };
  }
}
</script>
</body>
</html>
