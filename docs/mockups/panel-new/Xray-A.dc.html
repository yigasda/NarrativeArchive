<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프롬프트 X-ray A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 860px; box-sizing: border-box; padding: 22px 20px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-size: 20px; letter-spacing: -0.01em">프롬프트 X-ray</h1>
    <span style="font-size: 12.5px; color: #7A6A60">마지막으로 보낸 프롬프트 · 오늘 22:22</span>
  </div>

  <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="display: flex; align-items: baseline; gap: 6px"><b class="num" style="font-size: 32px; letter-spacing: -0.02em; line-height: 1">41,280</b><span style="font-size: 13px; color: #7A6A60">토큰</span></span>
      <span style="font-size: 12px; color: #7A6A60">메시지 29 · 월드인포 4</span>
    </div>
    <div style="display: flex; gap: 2px; height: 18px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <span style="flex: {{c.t}} 1 0; min-width: 3px; background: {{c.color}}; border-radius: 4px"></span>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #F1E6DD">
          <span style="width: 10px; height: 10px; border-radius: 3px; background: {{c.color}}"></span>
          <span style="flex: 1; font-size: 13.5px; color: {{c.ink}}; font-weight: {{c.weight}}">{{c.name}}</span>
          <b class="num" style="font-size: 13.5px">{{c.tok}}</b>
          <span class="num" style="width: 36px; text-align: right; font-size: 12px; color: #8A7A70">{{c.pct}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background: #FBE7E2; border: 1px solid #F0C6BC; border-radius: 18px; padding: 14px; display: flex; gap: 12px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13.5px; line-height: 1.45"><b style="color: #8C1D18">압축한 대화 4개가 원문으로도 들어갔어요</b><br><span style="color: #6B4A44">#35–#38 · 약 3,140 토큰이 아카이브와 겹쳐요</span></span>
      <button style="align-self: flex-start; display: flex; align-items: center; gap: 6px; border: 0; background: #B3261E; color: #fff; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>
        경계선까지 숨기기
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #6B5A50">겹치는 문장<span style="font-weight: 400; color: #8A7A70">1묶음 · 109자</span></span>
    <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
        <span style="font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #F6E1D3; color: #8A3A12">서사 아카이브</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A8B80" stroke-width="2" stroke-linecap="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>
        <span style="font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #ECE5F7; color: #5B3FA0">월드인포 · Horus</span>
      </div>
      <span style="font-size: 13px; color: #4A3D35; line-height: 1.5">“Horus could not classify it, and noted he could not remember holding bread that carried no price or petition.”</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const total = 41280;
    const rows = [
      ['서사 아카이브', 18420, '#B8541F'],
      ['대화 기록', 12880, '#A99C92'],
      ['압축됐는데 원문도 들어간 대화', 3140, '#D23B2C'],
      ['월드인포', 2310, '#7B5BC4'],
      ['캐릭터 카드', 1920, '#3D6FB6'],
      ['다른 확장', 1460, '#C99A1E'],
      ['그 외 (시스템 프롬프트 등)', 940, '#D8CCC2'],
      ['페르소나', 210, '#2E9A7A'],
    ];
    return {
      cats: rows.map(([name, t, color]) => ({
        name, t, color, tok: t.toLocaleString(), pct: `${Math.max(1, Math.round(t / total * 100))}%`,
        ink: color === '#D23B2C' ? '#B3261E' : '#2A211C', weight: color === '#D23B2C' ? 600 : 400,
      })),
    };
  }
}
</script>
</body>
</html>
