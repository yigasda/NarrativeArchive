<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A84A17}a:hover{color:#7E3610}
.num{font-variant-numeric:tabular-nums}
.sw{width:40px;height:24px;border-radius:999px;background:#B8541F;position:relative;flex:none}
.sw::after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sw.off{background:#D9C8BC}.sw.off::after{right:auto;left:3px}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; padding: 18px 16px 28px; background: #F6EDE6; color: #2A211C; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 10px">

  <div style="display: flex; align-items: center; gap: 10px">
    <button aria-label="돌아가기" style="width: 36px; height: 36px; border: 1px solid #E5D5C9; background: #FFFAF6; border-radius: 12px; display: grid; place-items: center; padding: 0; color: #2A211C"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <b style="flex: 1; font-size: 20px">설정</b>
    <button style="border: 1px solid #E5D5C9; background: #FFFAF6; color: #2A211C; font: inherit; font-size: 12.5px; padding: 7px 12px; border-radius: 999px">주입 미리보기</button>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: #8A7A70; padding: 0 6px; letter-spacing: 0.02em">{{g.name}}</span>
      <div style="background: #FFFAF6; border: 1px solid #E5D5C9; border-radius: 18px; overflow: hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: {{r.line}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
              <span style="font-size: 13.5px">{{r.label}}</span>
              <sc-if value="{{r.sub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11.5px; color: #8A7A70">{{r.sub}}</span></sc-if>
            </span>
            <sc-if value="{{r.isSw}}" hint-placeholder-val="{{ false }}"><span class="sw {{r.off}}"></span></sc-if>
            <sc-if value="{{r.val}}" hint-placeholder-val="{{ true }}">
              <span style="display: flex; align-items: center; gap: 4px; color: #8A7A70; font-size: 13px; max-width: 150px">
                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.val}}</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M9 6l6 6-6 6"/></svg>
              </span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const sw = (label, sub, on = true) => ({ label, sub, isSw: true, off: on ? '' : 'off', val: '' });
    const go = (label, sub, val) => ({ label, sub, isSw: false, val });
    const G = [
      ['주입', [sw('아카이브 주입', ''), go('위치', '', '채팅 안 · 깊이 1'), go('역할', '', '시스템')]],
      ['분량 · 라우터', [
        go('토큰 상한', '넘으면 알려 줘요', '없음'),
        sw('망각 곡선', '원문 8 · 짧게 20 · 나머지 한 줄 · 지금 −60%'),
        go('AI 라우터', '답하기 직전에 필요한 섹션을 골라요', '오래된 섹션 전부'),
        sw('가리키는 섹션도 같이', '고른 섹션에 적힌 #번호의 섹션'),
        go('키워드 연동', '최근 메시지에서 찾을 범위 · 연동 2개', '최근 4개'),
        go('키워드 테스트', '문장을 넣어 어떤 섹션이 불려 오는지', ''),
        go('고정 · 꺼 둔 섹션', '', '고정 1 · 꺼짐 0'),
      ]],
      ['AI · 번역', [
        go('AI 기능 모델', '질문 · 점검 · 라우터 · 온도 · 지문', 'Vertex · gemini-2.5-pro'),
        go('초안 모델', '압축 초안 · 섹션 짧은 버전', '커스텀 API'),
        go('번역 모델', '', 'AI 기능 모델과 같이'),
        go('답 최대 길이', '', '8,192 토큰'),
        go('이탈 자동 감지', 'AI 답이 쌓이면 조용히 검사', '끄기'),
        go('번역 용어집', '이름·장소 한국어 표기', '12개'),
      ]],
      ['알림', [go('백업 알림', '백업 뒤 이만큼 바뀌면', '10번')]],
    ];
    return { groups: G.map(([name, rows]) => ({ name, rows: rows.map((r, i) => ({ ...r, line: i ? '1px solid #F1E6DD' : '0', val: r.isSw ? '' : (r.val || ' ') })) })) };
  }
}
</script>
</body>
</html>
