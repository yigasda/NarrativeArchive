<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100;200;300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:30px;background:#e4e0dc;font-family:-apple-system,'SF Pro Text','Noto Sans KR',sans-serif}
.row{display:flex;gap:40px;margin-bottom:56px}.rowt{font:700 26px 'Noto Sans KR';color:#3a332c;margin:0 0 18px 6px}
.cap2{font:600 15px 'Noto Sans KR';color:#6b625b;text-align:center;margin-top:12px}
.ph{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#eceef1;color:#161b22;box-shadow:0 0 0 10px #16130f,0 20px 50px rgba(0,0,0,.25)}
.num{font-family:'Inter Tight',-apple-system,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
.b1,.b2{position:absolute;left:-75px;width:540px;border-radius:50%;filter:blur(80px)}
.b1{top:-200px;height:480px;background:#a9b4c0}.b2{bottom:-250px;height:460px;background:#9aa1ae}
.gel .b1,.gel .b2{opacity:.55}.gray .b1,.gray .b2{opacity:.7}
.app .b1,.app .b2{opacity:.32}
.noise{position:absolute;left:0;top:0;opacity:.06;mix-blend-mode:multiply;pointer-events:none}
.col{position:relative;height:100%;display:flex;flex-direction:column}
.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 36px;font-size:16px;font-weight:600;box-sizing:border-box}
.sbi{display:flex;gap:6px;align-items:center}
.glass{position:relative;background:rgba(255,255,255,.32);backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px) saturate(120%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(80,90,110,.06),0 14px 34px rgba(40,50,70,.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,1),rgba(255,255,255,.35) 35%,rgba(255,255,255,.12) 65%,rgba(255,255,255,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.cap{font-size:11px;font-weight:700;letter-spacing:.06em;color:#59616d}
.dim{color:#59616d}
/* icons as the canvas paints them: gel without gloss, gray without fill */
.ic{position:relative;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.gel .ic{background:linear-gradient(180deg,var(--c1),var(--c2));backdrop-filter:blur(18px) saturate(120%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -3px 6px rgba(40,40,60,.14),0 1px 1px rgba(40,50,70,.08),0 8px 20px rgba(40,50,70,.16)}
.gel .ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,255,255,.25) 35%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.55));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gel .ic svg{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(40,40,60,.18))}
.gray .ic{backdrop-filter:blur(20px) saturate(120%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(70,80,100,.12),0 1px 1px rgba(40,50,70,.06),0 8px 20px rgba(40,50,70,.12)}
.gray .ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,1),rgba(255,255,255,.3) 35%,rgba(255,255,255,.1) 62%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gray .ic::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:22px;border-radius:15px 15px 45% 45%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.gray .ic svg{position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.gray .ic svg path{stroke:#2a313b}
.ind{height:30px;display:flex;align-items:center;justify-content:center;flex:none}.ind span{width:134px;height:5px;border-radius:3px;background:#161b22}
/* lock */
.lk{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.lk .date{margin-top:18px;font-size:19px;font-weight:600;color:#3a4250}
.lk .clock{font-size:108px;font-weight:200;letter-spacing:-.05em;line-height:1;margin-top:2px}
.lk .notes{width:100%;margin-top:auto;display:flex;flex-direction:column;gap:10px}
.nt{border-radius:26px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.nt .ic{width:38px;height:38px;border-radius:11px}
.nt > div{flex:1;min-width:0}.nt b{font-size:14.5px;font-weight:600}.nt p{margin:2px 0 0;font-size:14.5px;line-height:1.35}.nt p span{display:block;font-size:12.5px;color:#59616d;margin-top:1px}
.nt small{font-size:12px;color:#59616d;flex:none;margin-top:2px}
.lk .open{margin:14px 0 6px;font-size:13px;color:#59616d}
/* app chrome */
.hd{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 0 12px;height:44px}
.back{width:40px;height:40px;display:grid;place-items:center}
.chips{display:flex;gap:8px}
.chip{border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
.ttl{padding:6px 22px 14px;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ttl small{display:block;font-size:14px;font-weight:500;color:#59616d;letter-spacing:0;margin-top:4px}
.card{margin:0 16px;border-radius:26px;overflow:hidden}
.rw{display:flex;gap:13px;align-items:center;padding:13px 16px;position:relative}
.rw + .rw::before{content:'';position:absolute;top:0;left:77px;right:0;border-top:.5px solid rgba(22,27,34,.1)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:19px;flex:none;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 4px 10px rgba(40,50,70,.14)}
.rw > div{flex:1;min-width:0}.rw b{font-size:16px;font-weight:600}.rw p{margin:2px 0 0;font-size:14px;color:#59616d;line-height:1.35}
.rw small{align-self:flex-start;margin-top:3px;font-size:13px;color:#59616d}
.dot{position:absolute;left:5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%}
.gel .dot{background:#8faed1}.gray .dot{background:#2a313b}
/* thread */
.th-h{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px 10px;border-radius:0 0 26px 26px}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.who .av{width:44px;height:44px;font-size:17px}
.msgs{flex:1;display:flex;flex-direction:column;gap:5px;padding:14px 14px}
.day{align-self:center;margin:6px 0 8px}
.bb{max-width:76%;padding:9px 14px;border-radius:20px;font-size:16px;line-height:1.35}
.bb span{display:block;margin-top:5px;padding-top:5px;font-size:13px}
.them{align-self:flex-start}.them span{border-top:1px solid rgba(22,27,34,.08);color:#59616d}
.me{align-self:flex-end}
.gel .me{background:linear-gradient(180deg,#bfd3e9d9,#8faed1d9);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -3px 6px rgba(40,40,60,.1),0 6px 16px rgba(40,50,70,.12);color:#161b22}
.gel .me span{border-top:1px solid rgba(22,27,34,.1);color:#3a4250}
.gray .me{background:#2a313b;color:#fff;box-shadow:0 6px 16px rgba(40,50,70,.18)}.gray .me span{border-top:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75)}
.read{align-self:flex-end;font-size:12px;color:#59616d;margin-top:2px}
.inp{margin:0 14px 6px;height:44px;border-radius:22px;display:flex;align-items:center;gap:7px;padding:0 18px;color:#59616d;font-size:14px}
/* photos */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.pc{border-radius:22px;overflow:hidden}
.pt{height:150px;display:grid;place-items:center;position:relative}
.pt svg{filter:drop-shadow(0 2px 3px rgba(40,40,60,.18))}
.pc p{margin:0;padding:10px 12px 12px;font-size:14px;font-weight:500;line-height:1.35}.pc p span{display:block;font-size:12.5px;font-weight:400;color:#59616d;margin-top:2px}.pc p small{display:block;font-size:11.5px;color:#59616d;margin-top:5px}
.draw{position:absolute;right:9px;bottom:9px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
/* calendar */
.wk{margin:0 16px 14px;border-radius:26px;padding:14px 12px}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px 0}
.wkd span{font-size:11px;font-weight:700;letter-spacing:.06em;color:#59616d}
.wkd b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto;border-radius:50%;font-size:17px;font-weight:300;position:relative}
.wkd b.on{font-weight:500}
.gel .wkd b.on{background:linear-gradient(180deg,#f0cbb5d9,#d89f98d9);color:#fff;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.8),0 4px 10px rgba(40,50,70,.14)}
.gray .wkd b.on{background:#2a313b;color:#fff}
.wkd b.has::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#8faed1}
.gray .wkd b.has::after{background:#6a727e}
.ev{display:flex;gap:12px;align-items:center;padding:13px 16px;position:relative}
.ev + .ev::before{content:'';position:absolute;top:0;left:78px;right:0;border-top:.5px solid rgba(22,27,34,.1)}
.evd{width:46px;flex:none;display:flex;flex-direction:column;align-items:center}
.evd b{font-size:28px;font-weight:200;letter-spacing:-.04em;line-height:1}
.evbar{width:3px;height:40px;border-radius:2px;flex:none}
.ev > div:last-child{flex:1;min-width:0}.ev strong{display:block;font-size:15px;font-weight:600}.ev em{display:block;font-style:normal;font-size:13px;color:#59616d;margin-top:1px}.ev small{display:block;font-size:12.5px;color:#59616d;margin-top:3px}
.sub{padding:4px 24px 8px}
</style></head><body><div id="out"></div>
<script>
const P={msg:'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4z',call:'M6 3h3l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z',photo:'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 16l5-5 4 4 3-3 6 6M15 9h.01',note:'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h5',cal:'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4',map:'M9 4L4 6v14l5-2 6 2 5-2V4l-5 2zM9 4v14M15 6v14',heart:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',back:'M15 5l-7 7 7 7',lock:'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3',user:'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 21a8 8 0 0 1 16 0'};
const G={photo:['#f0cbb5','#d89f98','#fff'],cal:['#f6f7f9','#dcdfe5','#b0564e'],note:['#f4e5b5','#dcc680','#5a4a1f'],map:['#c3dcc1','#93ba97','#fff'],call:['#bbddc0','#89b892','#fff'],msg:['#bbddc0','#89b892','#fff']};
const sv=(k,s,c,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
const ic=(k,s,gs)=>{const[a,b,g]=G[k];return `<span class="ic" style="width:${s}px;height:${s}px;border-radius:${Math.round(s*.29)}px;--c1:${a}d9;--c2:${b}d9">${sv(k,gs,g)}</span>`};
const sb=(t)=>`<div class="sb"><span class="num">${t}</span><span class="sbi"><svg width="18" height="12" viewBox="0 0 18 12" fill="#161b22"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#161b22" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4 7a6 6 0 0 1 8 0"/><circle cx="8" cy="10" r="1" fill="#161b22" stroke="none"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="#161b22" stroke-opacity="0.4"/><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#161b22"/><path d="M25.5 4.5v4" stroke="#161b22" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/></svg></span></div>`;
const bg=(app)=>`<div class="b1"></div><div class="b2"></div><svg class="noise" width="390" height="844"><filter id="n${Math.random().toString(36).slice(2,6)}"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#__)"/></svg>`;
const AV={R:['#bfd3e9','#8faed1'],I:['#d3cae9','#a699c9'],M:['#f0cbb5','#d89f98']};
const av=(l,t)=>t==='gray'?`<span class="av" style="background:linear-gradient(180deg,#d1d4d9,#a2a7af)">${l}</span>`:`<span class="av" style="background:linear-gradient(180deg,${AV[l][0]},${AV[l][1]})">${l}</span>`;
const hd=(chips)=>`<div class="hd"><span class="back">${sv('back',24,'#161b22',2.2)}</span><span class="chips">${chips}</span></div>`;
const chip=(t,i)=>`<span class="chip glass">${i?sv(i,14,'#161b22',2.2):''}${t}</span>`;
function lock(t){return `<div class="ph ${t}">${bg()}<div class="col">${sb('')}<div class="lk">${sv('lock',22,'#3a4250',2)}<div class="date">25.10. · 토요일</div><div class="clock num">17:42</div>
<div class="notes"><div class="nt glass">${ic('msg',38,20)}<div><b>Ivo (Werkstatt)</b><p>Ruf mich zurück. Wichtig.<span>다시 전화해. 중요해.</span></p></div><small>12분 전</small></div>
<div class="nt glass">${ic('call',38,20)}<div><b>부재중 전화</b><p>Ivo (Werkstatt) · 2통</p></div><small>14분 전</small></div>
<div class="nt glass">${ic('cal',38,20)}<div><b>캘린더</b><p>Schlüssel zurückgeben · 19:00<span>열쇠 돌려주기</span></p></div></div></div>
<div class="open">눌러서 열기</div></div><div class="ind"><span></span></div></div></div>`}
function list(t){return `<div class="ph ${t} app">${bg()}<div class="col">${sb('17:42')}${hd(chip('가 한국어'))}<div class="ttl">메시지</div>
<div class="card glass"><div class="rw">${av('R',t)}<div><b>Ren ♥</b><p>Fünf Minuten.</p></div><small class="num">17:40</small></div>
<div class="rw"><span class="dot"></span>${av('I',t)}<div><b>Ivo (Werkstatt)</b><p>Ruf mich zurück. Wichtig.</p></div><small class="num">17:30</small></div>
<div class="rw">${av('M',t).replace('>M<','>A<')}<div><b>Anja</b><p>Kommst du Sonntag?</p></div><small class="num">23.10.</small></div></div>
<div style="flex:1"></div><div class="ind"><span></span></div></div></div>`}
function thread(t){return `<div class="ph ${t} app">${bg()}<div class="col">${sb('17:42')}<div class="th-h glass"><span class="back">${sv('back',24,'#161b22',2.2)}</span><span class="who">${av('R',t)}Ren ♥</span>${chip('가 한국어')}</div>
<div class="msgs"><div class="day cap num">25.10. · 17:31</div>
<div class="bb them glass">Tut mir leid wegen vorhin<span>아까 일은 미안</span></div>
<div class="bb me">Schon gut. Ist mir egal.<span>됐어. 신경 안 써.</span></div>
<div class="bb them glass">Lügnerin<span>거짓말</span></div>
<div class="bb them glass">Ich steh vor der Garage. Komm raus.<span>창고 앞이야. 나와.</span></div>
<div class="bb me">Fünf Minuten.<span>5분만.</span></div><div class="read num">읽음 17:40</div></div>
<div class="inp glass">${sv('lock',15,'#59616d',2)} 보기 전용</div><div class="ind"><span></span></div></div></div>`}
const MOOD=t=>t==='gray'?[['#e2e4e8','#aeb2b9'],['#d1d4d9','#a2a7af'],['#dcdfe5','#b4b9c1'],['#e6e7ea','#c0c4ca']]:[['#f0cbb5','#d89f98'],['#bfd3e9','#8faed1'],['#c3dcc1','#93ba97'],['#efc4d0','#d494a7']];
function photos(t){const m=MOOD(t);const pcs=[['photo','Sonnenuntergang hinter der Garage','창고 뒤 노을, 흔들림','24.10. 18:12',1],['photo','Regentropfen am Busfenster','버스 창문 빗물','22.10. 08:40'],['map','Die Bank am Fluss','Varo 강가 벤치','19.10. 16:03'],['heart','Zwei Kaffeebecher','커피잔 두 개','25.10. 18:20']];
return `<div class="ph ${t} app">${bg()}<div class="col">${sb('17:42')}${hd(chip('외모','user')+chip('가 한국어'))}<div class="ttl">사진<small class="num">4장</small></div>
<div class="pg">${pcs.map(([k,a,b,c,d],i)=>`<div class="pc glass"><div class="pt" style="background:linear-gradient(160deg,${m[i][0]},${m[i][1]})">${sv(k,34,'rgba(255,255,255,.95)',1.6)}<span class="draw glass">${d?'다시 그리기':'그리기'}</span></div><p>${a}<span>${b}</span><small class="num">${c}</small></p></div>`).join('')}</div>
<div style="flex:1"></div><div class="ind"><span></span></div></div></div>`}
function cal(t){const bars=t==='gray'?['#2a313b','rgba(22,27,34,.22)','#6a727e']:['#d89f98','#8faed1','#d494a7'];
return `<div class="ph ${t} app">${bg()}<div class="col">${sb('17:42')}${hd(chip('가 한국어'))}<div class="ttl">캘린더<small class="num">10월 · 25.10.</small></div>
<div class="wk glass"><div class="wkd">${['월','화','수','목','금','토','일'].map(d=>`<span>${d}</span>`).join('')}${[20,21,22,23,24,25,26].map(d=>`<b class="num ${d===25?'on has':''}">${d}</b>`).join('')}</div></div>
<div class="sub cap">다가오는 일정</div>
<div class="card glass"><div class="ev"><div class="evd"><b class="num">25</b><span class="cap">10월</span></div><span class="evbar" style="background:${bars[0]}"></span><div><strong>Schlüssel zurückgeben</strong><em>열쇠 돌려주기</em><small class="num">19:00</small></div></div>
<div class="ev"><div class="evd"><b class="num">27</b><span class="cap">10월</span></div><span class="evbar" style="background:${bars[1]}"></span><div><strong>Werkstatt – Ivo</strong><em>정비소 – Ivo</em><small class="num">10:00</small></div></div></div>
<div class="sub cap" style="margin-top:14px">기념일</div>
<div class="card glass"><div class="ev"><div class="evd">${sv('heart',22,bars[2],2.2)}</div><span class="evbar" style="background:${bars[2]}"></span><div><strong>첫 만남</strong><small>매년 19.10.</small></div></div></div>
<div style="flex:1"></div><div class="ind"><span></span></div></div></div>`}
let n=0;
const fixNoise=h=>h.replace(/<filter id="n(\w+)">/g,(a,b)=>a).replace(/filter="url\(#__\)"/g,()=>`filter="url(#n${++n})"`).replace(/<filter id="n\w+">/g,()=>`<filter id="n${n+1}">`);
const scr=[['잠금화면',lock],['메시지',list],['대화방',thread],['사진첩',photos],['캘린더',cal]];
document.getElementById('out').innerHTML=['gel','gray'].map(t=>`<div class="rowt">${t==='gel'?'컬러 젤':'화이트 그레이'}</div><div class="row">${scr.map(([nm,f])=>`<div><div>${f(t)}</div><div class="cap2">${nm}</div></div>`).join('')}</div>`).join('');
// give each noise filter a unique id
document.querySelectorAll('svg.noise').forEach((s,i)=>{const f=s.querySelector('filter');f.id='nz'+i;s.querySelector('rect').setAttribute('filter',`url(#nz${i})`)});
</script></body></html>
