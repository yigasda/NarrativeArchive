<style>
.mk_wrap{display:flex;gap:22px;padding:24px;background:#141210;font-family:-apple-system,'Noto Sans KR',sans-serif;align-items:flex-start}
.mk_col{display:flex;flex-direction:column;gap:10px;align-items:center}.mk_lab{color:#ff6fa3;font:700 15px sans-serif}
.pop{width:390px;background:#F0E4DB;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;color:#463428;padding:16px 16px 14px;box-sizing:border-box}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#E9DCD1}
.tabs span{height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:#6B5A50}
.tabs span.on{background:#F7EEE7;color:#A84A17;box-shadow:0 1px 2px rgba(70,52,40,.1)}
.card{background:#F7EEE7;border-radius:18px;box-shadow:0 1px 2px rgba(70,52,40,.05),0 6px 16px rgba(70,52,40,.07)}
.btn{height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;font-weight:700}
.pri{background:#B8541F;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px rgba(184,84,31,.25)}
.sec{background:#F7EEE7;color:#6B5A50;box-shadow:inset 0 0 0 1px #E5D5C9}
.lnk{font-size:13px;font-weight:600;color:#A84A17;text-align:center}
.ic{width:52px;height:52px;border-radius:999px;background:#F6E1D3;color:#B8541F;display:flex;align-items:center;justify-content:center}
.ttl{font-size:16px;font-weight:700;text-align:center}.ds{font-size:12.5px;color:#7A6A60;text-align:center;line-height:1.5}
.sect{font-size:12.5px;font-weight:700;color:#8A7A70;margin:16px 4px 8px;display:flex;justify-content:space-between}
.sect small{font-weight:600;color:#A84A17;font-size:11.5px}
.face{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:12px 14px 6px}
.who small{font-weight:500;color:#8A7A70;font-size:12px}
.q{padding:4px 14px 4px 46px;font-size:13.5px;line-height:1.5;color:#463428}
.q i{display:block;font-style:normal;font-size:11.5px;color:#9A8A80;margin-top:1px}
.hr{height:1px;background:#EADBD0;margin:8px 14px 0}
.excl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8A7A70;margin-top:12px;padding:0 4px}
.plus{border:1px dashed #CDB8A8;border-radius:999px;padding:2px 9px;font-size:12px;color:#7A6A60}
.close{align-self:center;margin-top:14px;padding:7px 18px;border-radius:999px;background:#F7EEE7;font-size:13px;font-weight:600;color:#6B5A50;box-shadow:0 1px 2px rgba(70,52,40,.08)}
.dim{opacity:.55}
.tile{display:flex;gap:12px;padding:14px;align-items:flex-start}
.tile .ti{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.tile b{display:block;font-size:14.5px;margin-bottom:3px}.tile span.t{font-size:12.5px;color:#7A6A60;line-height:1.5}
.tile .go{margin-left:auto;align-self:center;color:#B8541F}
.bub{display:flex;gap:8px;align-items:flex-end}
.bub .b{background:#F7EEE7;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 2px rgba(70,52,40,.05),0 4px 12px rgba(70,52,40,.06)}
.bub.r{flex-direction:row-reverse}.bub.r .b{border-radius:16px 16px 4px 16px}
.bub .b small{display:block;font-size:11px;color:#9A8A80;margin-top:2px}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.step .n{width:24px;height:24px;border-radius:999px;background:#B8541F;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.step .n.g{background:#E2D3C7;color:#7A6A60}
.step b{display:block;font-size:14px}.step span.t{font-size:12.5px;color:#7A6A60;line-height:1.5}
.fp{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.fp span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#F6E1D3;color:#A84A17;font-weight:600}
.ex{font-size:11px;font-weight:700;color:#A84A17;background:#F6E1D3;border-radius:999px;padding:1px 7px;margin-left:auto}
</style>
