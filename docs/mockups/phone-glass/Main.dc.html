<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>클리어 글래스 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@100;200;300;400;500;600&amp;family=Noto+Sans+KR:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3a4250}a:hover{color:#161b22}
button{font:inherit;color:inherit;cursor:pointer;padding:0;border:0;background:none}
.num{font-family:'Inter Tight',-apple-system,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
.glass{position:relative;background:rgba(255,255,255,0.32);backdrop-filter:blur(26px) saturate(120%);-webkit-backdrop-filter:blur(26px) saturate(120%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.95),inset 0 -1px 1px rgba(80,90,110,0.06),0 14px 34px rgba(40,50,70,0.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,1),rgba(255,255,255,0.35) 35%,rgba(255,255,255,0.12) 65%,rgba(255,255,255,0.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.lbl{font-size:11.5px;font-weight:600;color:#1f252e;letter-spacing:-0.01em}
.badge{position:absolute;top:-5px;right:-5px;z-index:2;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;background:#ff3b30;color:#ffffff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,0.9)}
.cap{font-size:11px;font-weight:700;letter-spacing:0.06em;color:#59616d}
.ic{position:relative;width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 100% at 28% 10%,rgba(255,255,255,{{shine}}),rgba(255,255,255,0.18) 50%,rgba(255,255,255,0.1) 100%);backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.95),inset 0 -2px 4px rgba(70,80,100,0.12),0 1px 1px rgba(40,50,70,0.06),0 8px 20px rgba(40,50,70,0.12)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,255,255,1),rgba(255,255,255,0.3) 35%,rgba(255,255,255,0.1) 62%,rgba(255,255,255,0.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ic::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:22px;border-radius:15px 15px 45% 45%;background:linear-gradient(rgba(255,255,255,0.55),rgba(255,255,255,0));pointer-events:none}
.ic svg{position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(255,255,255,0.8))}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #eceef1; font-family: -apple-system, 'SF Pro Text', 'Noto Sans KR', sans-serif; color: #161b22">
<div aria-hidden="true" style="position: absolute; width: 540px; height: 480px; left: -75px; top: -200px; border-radius: 50%; background: {{top}}; filter: blur(80px); opacity: {{depth}}"></div>
<div aria-hidden="true" style="position: absolute; width: 540px; height: 460px; left: -75px; bottom: -250px; border-radius: 50%; background: {{bottom}}; filter: blur(80px); opacity: {{depth}}"></div>
<svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0; opacity: 0.06; mix-blend-mode: multiply; pointer-events: none"><filter id="cg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#cg)"></rect></svg>

<div style="position: relative; height: 100%; display: flex; flex-direction: column">
<div style="height: 54px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0 36px; font-size: 16px; font-weight: 600">
<span class="num" style="letter-spacing: -0.01em">9:41</span>
<span style="display: flex; gap: 6px; align-items: center">
<svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" fill="#161b22"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
<svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#161b22" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4 7a6 6 0 0 1 8 0"></path><circle cx="8" cy="10" r="1" fill="#161b22" stroke="none"></circle></svg>
<svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="#161b22" stroke-opacity="0.4"></rect><rect x="2.5" y="2.5" width="16" height="8" rx="2" fill="#161b22"></rect><path d="M25.5 4.5v4" stroke="#161b22" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"></path></svg>
</span>
</div>

<div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 26px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<div class="glass" style="height: 168px; box-sizing: border-box; border-radius: 26px; padding: 15px 16px; display: flex; flex-direction: column">
<span class="cap" style="color: {{accent}}">목요일</span>
<span class="num" style="font-size: 54px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; margin: 2px 0 0 -2px">29</span>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 3px; height: 26px; border-radius: 2px; background: {{accent}}"></span><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 600">[캐릭터]와 저녁</span><span class="num" style="font-size: 11px; color: #59616d">7:00 PM</span></div></div>
<div style="display: flex; gap: 7px; align-items: center"><span style="width: 3px; height: 26px; border-radius: 2px; background: rgba(22, 27, 34, 0.22)"></span><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; font-weight: 600">작업 마감</span><span class="num" style="font-size: 11px; color: #59616d">11:30 PM</span></div></div>
</div>
</div>
<div class="glass" style="height: 168px; box-sizing: border-box; border-radius: 26px; padding: 15px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span class="cap">메모</span>
<span class="num" style="font-size: 11px; color: #59616d">1/3</span>
</div>
<div style="display: flex; gap: 9px; align-items: center"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; background: #2a313b; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span style="font-size: 13px; font-weight: 500; color: #6a727e; text-decoration: line-through">답장하기</span></div>
<div style="display: flex; gap: 9px; align-items: center"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(22, 27, 34, 0.4)"></span><span style="font-size: 13px; font-weight: 500">선물 고르기</span></div>
<div style="display: flex; gap: 9px; align-items: center"><span style="width: 16px; height: 16px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(22, 27, 34, 0.4)"></span><span style="font-size: 13px; font-weight: 500">예약 확인</span></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 22px; padding: 0 4px">
<sc-for list="{{apps}}" as="a" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 7px">
<button class="ic" aria-label="{{a.label}}">
<svg aria-hidden="true" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2a313b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg>
<sc-if value="{{a.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="badge num">{{a.badge}}</span></sc-if>
</button>
<span class="lbl">{{a.label}}</span>
</div>
</sc-for>
</div>
</div>

<div style="flex: 1"></div>

<div aria-hidden="true" style="display: flex; justify-content: center; gap: 7px; padding-bottom: 16px">
<span style="width: 7px; height: 7px; border-radius: 50%; background: rgba(22, 27, 34, 0.25)"></span>
<span style="width: 7px; height: 7px; border-radius: 50%; background: #161b22"></span>
</div>

<div style="padding: 0 14px">
<div class="glass" style="border-radius: 34px; padding: 13px 16px; display: flex; justify-content: space-between; background: rgba(255, 255, 255, 0.24)">
<sc-for list="{{dock}}" as="a" hint-placeholder-count="4">
<button class="ic" aria-label="{{a.label}}">
<svg aria-hidden="true" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#2a313b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg>
</button>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="height: 30px; display: flex; align-items: center; justify-content: center"><span style="width: 134px; height: 5px; border-radius: 3px; background: #161b22"></span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"top":{"editor":"color","default":"#a9b4c0","options":["#a9b4c0","#b8bcc2","#9fb3c4","#c2c6cc"]},"bottom":{"editor":"color","default":"#9aa1ae","options":["#9aa1ae","#a7aab0","#98a3b8","#b4b7bd"]},"depth":{"editor":"range","default":0.7,"min":0.2,"max":1,"step":0.05},"accent":{"editor":"color","default":"#2a313b","options":["#2a313b","#3b6ea8","#6d7480","#c2410c"]},"shine":{"editor":"range","default":0.55,"min":0.2,"max":0.9,"step":0.05},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      msg: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4z',
      phone: 'M6 3h3l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z',
      photo: 'M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 16l5-5 4 4 3-3 6 6M15 9h.01',
      memo: 'M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h5',
      cal: 'M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM4 10h16M9 3v4M15 3v4',
      heart: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
      gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1',
      cam: 'M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z',
      map: 'M9 4L4 6v14l5-2 6 2 5-2V4l-5 2zM9 4v14M15 6v14',
      mail: 'M3 6h18v12H3zM3 7l9 6 9-6',
      book: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',
      search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4'
    };
    function app(label, d, badge) { return { label: label, d: d, badge: badge || 0, hasBadge: !!badge }; }
    return {
      top: this.props.top ?? '#a9b4c0',
      bottom: this.props.bottom ?? '#9aa1ae',
      depth: this.props.depth ?? 0.7,
      accent: this.props.accent ?? '#2a313b',
      shine: this.props.shine ?? 0.55,
      apps: [app('사진', I.photo), app('캘린더', I.cal), app('메모', I.memo), app('지도', I.map),
             app('SNS', I.heart, 5), app('메일', I.mail, 1), app('일기', I.book), app('설정', I.gear)],
      dock: [app('전화', I.phone), app('메시지', I.msg), app('카메라', I.cam), app('검색', I.search)]
    };
  }
}
</script>
</body>
</html>
